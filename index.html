<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운전 음성 메모</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .header {
      padding-top: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #9e9e9e;
    }
    .status-box {
      font-size: 1.3rem;
      font-weight: bold;
      min-height: 50px;
      text-align: center;
      padding: 0 25px;
      color: #eeeeee;
      line-height: 1.4;
      word-break: keep-all;
    }
    .button-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px;
    }
    .record-btn {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid #2e2e30;
      background: linear-gradient(145deg, #1e1e20, #2a2a2d);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .record-btn .icon {
      font-size: 3.2rem;
      margin-bottom: 10px;
    }
    .recording {
      background: linear-gradient(145deg, #d32f2f, #f44336) !important;
      border-color: #ff7961 !important;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 45px rgba(244, 67, 54, 0.7);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .uploading {
      background: #424242 !important;
      border-color: #616161 !important;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="header">운전 음성 메모</div>
  <div class="status-box" id="statusText">버튼을 눌러 녹음을 시작하세요</div>

  <div class="button-container">
    <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
      <span class="icon" id="btnIcon">🎙️</span>
      <span id="btnLabel">녹음 시작</span>
    </button>
  </div>

  <script>
    // 복사한 Google Apps Script 웹 앱 URL을 아래에 넣으세요
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRcyryh0nsGTM_szCY_NIsCbn-GlIfsvWo8MA61CvKtT1k1pHWQbOdLIlpqinPIF8D/exec";

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let speechRecognizer = null;
    let recognizedText = "";

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechRecognizer = new SpeechRecognition();
      speechRecognizer.lang = 'ko-KR';
      speechRecognizer.continuous = true;
      speechRecognizer.interimResults = false;

      speechRecognizer.onresult = function(event) {
        let text = "";
        for (let i = 0; i < event.results.length; ++i) {
          text += event.results[i][0].transcript + " ";
        }
        recognizedText = text.trim();
        document.getElementById('statusText').innerText = `"${recognizedText}"`;
      };
    }

    async function toggleRecord() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      vibrate([100]);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = uploadRecording;

        mediaRecorder.start();
        isRecording = true;
        recognizedText = "";

        const btn = document.getElementById('recordBtn');
        btn.classList.add('recording');
        document.getElementById('btnIcon').innerText = "⏹️";
        document.getElementById('btnLabel').innerText = "녹음 종료";
        document.getElementById('statusText').innerText = "듣고 있습니다... 말씀하세요";

        if (speechRecognizer) {
          try { speechRecognizer.start(); } catch(e){}
        }

      } catch (err) {
        alert("마이크 접근 오류: " + err.message);
      }
    }

    function stopRecording() {
      vibrate([60, 60, 60]);
      isRecording = false;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      if (speechRecognizer) {
        try { speechRecognizer.stop(); } catch(e){}
      }

      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      btn.classList.add('uploading');
      document.getElementById('btnIcon').innerText = "⏳";
      document.getElementById('btnLabel').innerText = "저장 중...";
      document.getElementById('statusText').innerText = "구글 시트와 드라이브에 저장 중입니다...";
    }

    function uploadRecording() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();

      reader.readAsDataURL(audioBlob);
      reader.onloadend = async function() {
        const base64Data = reader.result.split(',')[1];
        const payload = {
          fileName: `DriveRec_${Date.now()}.webm`,
          mimeType: 'audio/webm',
          audioBase64: base64Data,
          transcript: recognizedText || "(인식된 음성 없음)",
          summary: recognizedText ? recognizedText.slice(0, 30) : "-"
        };

        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });

          const btn = document.getElementById('recordBtn');
          btn.classList.remove('uploading');
          document.getElementById('btnIcon').innerText = "🎙️";
          document.getElementById('btnLabel').innerText = "녹음 시작";
          vibrate([150]);
          document.getElementById('statusText').innerText = "✅ 저장 완료되었습니다!";
        } catch (err) {
          const btn = document.getElementById('recordBtn');
          btn.classList.remove('uploading');
          document.getElementById('btnIcon').innerText = "🎙️";
          document.getElementById('btnLabel').innerText = "녹음 시작";
          document.getElementById('statusText').innerText = "❌ 전송 실패: " + err.message;
        }
      };
    }
  </script>
</body>
</html>
