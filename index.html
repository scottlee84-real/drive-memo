<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운전 음성 메모</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .header {
      padding-top: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #9e9e9e;
    }
    .status-box {
      font-size: 1.25rem;
      font-weight: bold;
      min-height: 50px;
      text-align: center;
      padding: 0 25px;
      color: #eeeeee;
      line-height: 1.4;
      word-break: keep-all;
    }
    .button-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px;
    }
    .record-btn {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid #2e2e30;
      background: linear-gradient(145deg, #1e1e20, #2a2a2d);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
    }
    .record-btn .icon {
      font-size: 3.2rem;
      margin-bottom: 10px;
    }
    .recording {
      background: linear-gradient(145deg, #d32f2f, #f44336) !important;
      border-color: #ff7961 !important;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 45px rgba(244, 67, 54, 0.7);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .uploading {
      background: #f57f17 !important;
      border-color: #ffb74d !important;
      pointer-events: none;
    }
    .sent {
      background: #2e7d32 !important;
      border-color: #66bb6a !important;
      box-shadow: 0 0 35px rgba(76, 175, 80, 0.7);
    }
  </style>
</head>
<body>

  <div class="header">운전 음성 메모</div>
  <div class="status-box" id="statusText">버튼을 눌러 녹음을 시작하세요</div>

  <div class="button-container">
    <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
      <span class="icon" id="btnIcon">🎙️</span>
      <span id="btnLabel">녹음 시작</span>
    </button>
  </div>

  <script>
    // 현재 실제 배포된 최신 웹앱 URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRcyryh0nsGTM_szCY_NIsCbn-GlIfsvWo8MA61CvKtT1k1pHWQbOdLIlpqinPIF8D/exec";

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    async function toggleRecord() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      vibrate([80]);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const options = {
          mimeType: 'audio/webm;codecs=opus',
          audioBitsPerSecond: 16000
        };

        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mediaRecorder = new MediaRecorder(stream, options);
        } else {
          mediaRecorder = new MediaRecorder(stream);
        }

        audioChunks = [];
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = processAndSend;
        mediaRecorder.start();
        isRecording = true;

        const btn = document.getElementById('recordBtn');
        btn.className = "record-btn recording";
        document.getElementById('btnIcon').innerText = "⏹️";
        document.getElementById('btnLabel').innerText = "녹음 종료";
        document.getElementById('statusText').innerText = "듣고 있습니다... 말씀하세요";

      } catch (err) {
        alert("마이크 접근 오류: " + err.message);
      }
    }

    function stopRecording() {
      isRecording = false;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }

      const btn = document.getElementById('recordBtn');
      btn.className = "record-btn uploading";
      document.getElementById('btnIcon').innerText = "⏳";
      document.getElementById('btnLabel').innerText = "전송 중...";
      document.getElementById('statusText').innerText = "구글로 전송 중... 잠시만 기다려주세요";
    }

    function processAndSend() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();

      reader.readAsDataURL(audioBlob);
      reader.onloadend = async function() {
        const base64Data = reader.result.split(',')[1];
        const payload = JSON.stringify({
          fileName: `DriveRec_${Date.now()}.webm`,
          mimeType: 'audio/webm',
          audioBase64: base64Data
        });

        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: payload
          });

          const btn = document.getElementById('recordBtn');
          btn.className = "record-btn sent";
          document.getElementById('btnIcon').innerText = "🚀";
          document.getElementById('btnLabel').innerText = "전송 완료";
          document.getElementById('statusText').innerText = "✅ 전송 완료! 이제 앱을 전환하셔도 됩니다.";
          vibrate([200]);

        } catch (err) {
          const btn = document.getElementById('recordBtn');
          btn.className = "record-btn";
          document.getElementById('btnIcon').innerText = "⚠️";
          document.getElementById('btnLabel').innerText = "재시도";
          document.getElementById('statusText').innerText = "전송 실패: " + err.message;
        }

        setTimeout(() => {
          const btn = document.getElementById('recordBtn');
          btn.className = "record-btn";
          document.getElementById('btnIcon').innerText = "🎙️";
          document.getElementById('btnLabel').innerText = "녹음 시작";
          document.getElementById('statusText').innerText = "버튼을 눌러 녹음을 시작하세요";
        }, 1500);
      };
    }
  </script>
</body>
</html>
