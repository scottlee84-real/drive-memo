<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운전 음성 메모</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .header {
      padding-top: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #9e9e9e;
    }
    .status-box {
      font-size: 1.25rem;
      font-weight: bold;
      min-height: 50px;
      text-align: center;
      padding: 0 25px;
      color: #eeeeee;
      line-height: 1.4;
      word-break: keep-all;
    }
    .button-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px;
    }
    .record-btn {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid #2e2e30;
      background: linear-gradient(145deg, #1e1e20, #2a2a2d);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
    }
    .record-btn .icon {
      font-size: 3.2rem;
      margin-bottom: 10px;
    }
    .recording {
      background: linear-gradient(145deg, #d32f2f, #f44336) !important;
      border-color: #ff7961 !important;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 45px rgba(244, 67, 54, 0.7);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .sending {
      background: #2e7d32 !important;
      border-color: #66bb6a !important;
    }
  </style>
</head>
<body>

  <div class="header">운전 음성 메모</div>
  <div class="status-box" id="statusText">버튼을 눌러 녹음을 시작하세요</div>

  <div class="button-container">
    <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
      <span class="icon" id="btnIcon">🎙️</span>
      <span id="btnLabel">녹음 시작</span>
    </button>
  </div>

  <script>
    // 본인의 Google Apps Script 배포 URL (/exec)
    const GAS_WEB_APP_URL = "여기에_GAS_웹앱_URL을_붙여넣으세요";

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    async function toggleRecord() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      vibrate([100]);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // 16kbps 음성 전용 초경량 압축 설정 (용량 1/8 감소)
        const options = {
          mimeType: 'audio/webm;codecs=opus',
          audioBitsPerSecond: 16000
        };

        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mediaRecorder = new MediaRecorder(stream, options);
        } else {
          mediaRecorder = new MediaRecorder(stream);
        }

        audioChunks = [];
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = uploadRecordingFast;
        mediaRecorder.start();
        isRecording = true;

        const btn = document.getElementById('recordBtn');
        btn.classList.add('recording');
        document.getElementById('btnIcon').innerText = "⏹️";
        document.getElementById('btnLabel').innerText = "녹음 종료";
        document.getElementById('statusText').innerText = "듣고 있습니다... 말씀하세요";

      } catch (err) {
        alert("마이크 접근 오류: " + err.message);
      }
    }

    function stopRecording() {
      vibrate([60, 60]);
      isRecording = false;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }

      // 화면 상태를 '즉시 전송 중'으로 변경
      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      btn.classList.add('sending');
      document.getElementById('btnIcon').innerText = "🚀";
      document.getElementById('btnLabel').innerText = "전송 완료";
      document.getElementById('statusText').innerText = "전송 완료! 창을 닫거나 앱을 전환하셔도 됩니다.";
    }

    function uploadRecordingFast() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();

      reader.readAsDataURL(audioBlob);
      reader.onloadend = function() {
        const base64Data = reader.result.split(',')[1];
        const payload = JSON.stringify({
          fileName: `DriveRec_${Date.now()}.webm`,
          mimeType: 'audio/webm',
          audioBase64: base64Data
        });

        // keepalive를 적용하여 창을 닫거나 다른 앱으로 전환해도 백그라운드 전송 보장
        try {
          fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            keepalive: true,
            headers: { 'Content-Type': 'text/plain' },
            body: payload
          });
        } catch (e) {
          // 페이로드가 큰 경우 기본 fetch로 폴백 전송
          fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: payload
          });
        }

        // 1초 후 UI를 다음 녹음 대기 상태로 자동 복귀
        setTimeout(() => {
          const btn = document.getElementById('recordBtn');
          btn.classList.remove('sending');
          document.getElementById('btnIcon').innerText = "🎙️";
          document.getElementById('btnLabel').innerText = "녹음 시작";
          document.getElementById('statusText').innerText = "버튼을 눌러 녹음을 시작하세요";
        }, 1200);
      };
    }
  </script>
</body>
</html>
